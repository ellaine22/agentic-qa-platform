# @case:MOB-CAT-001 Catalog lists products with name and price
# @case:MOB-CART-001 Adding a product updates the cart badge
# One flow covers two cases, so both tags are declared. The coverage agent
# counts each tag, which is why a flow must never drop one when it is edited.
appId: com.saucelabs.mydemoapp.rn
---
- launchApp:
    clearState: true
- assertVisible: "Products"
- assertVisible:
    text: "\\$.*"
- tapOn:
    id: "store item"
    index: 0
- assertVisible: "Add To Cart"
- tapOn: "Add To Cart"
- assertVisible:
    id: "cart badge"
    text: "1"
- takeScreenshot: evidence/MOB-CART-001
