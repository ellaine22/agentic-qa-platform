name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

      # Full lifecycle with the local provider and replay driver: no network, no API key
      - run: npm run demo

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: out/dashboard.html
          retention-days: 7
